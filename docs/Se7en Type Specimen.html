<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Se7en — Type Specimen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- A: Iron — Bebas Neue + Barlow + Space Mono -->
  <!-- B: Edge — Syne + JetBrains Mono -->
  <!-- C: Form — Space Grotesk + Space Mono -->
  <!-- D: Signal — Instrument Serif + Instrument Sans + JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: oklch(6% 0.015 35); }
    body { font-family: 'Barlow', sans-serif; }
    ::-webkit-scrollbar { width: 0; }
    button { cursor: pointer; }

    @keyframes fade-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fade-in 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const GOLD  = 'oklch(78% 0.20 68)';
const FIRE  = 'oklch(70% 0.24 42)';
const COOL  = 'oklch(64% 0.14 220)';

// ── Font system definitions ──────────────────────────────────
const FONTS = {
  A: {
    id: 'A',
    name: 'Iron',
    tagline: 'Condensed. Commanding. Athletic.',
    note: 'Bebas Neue is the typeface of real gyms — it has weight, it takes up space. Barlow carries the detail. Unashamedly physical.',
    display:  { family: "'Bebas Neue', sans-serif",    weight: 400, tracking: '0.02em', transform: 'uppercase' },
    headline: { family: "'Barlow Condensed', sans-serif", weight: 800, tracking: '-0.01em', transform: 'uppercase' },
    body:     { family: "'Barlow', sans-serif",         weight: 400, tracking: '0em',    transform: 'none' },
    label:    { family: "'Barlow', sans-serif",         weight: 700, tracking: '0.10em', transform: 'uppercase' },
    data:     { family: "'Space Mono', monospace",      weight: 700, tracking: '-0.03em',transform: 'none' },
    dataSub:  { family: "'Space Mono', monospace",      weight: 400, tracking: '0em',    transform: 'none' },
    accent: GOLD,
  },
  B: {
    id: 'B',
    name: 'Edge',
    tagline: 'Geometric. Distinctive. Precise.',
    note: 'Syne has deliberate optical anomalies — the "a" and "e" are unlike anything else on the App Store. It reads as designed, not picked.',
    display:  { family: "'Syne', sans-serif",           weight: 800, tracking: '-0.04em', transform: 'none' },
    headline: { family: "'Syne', sans-serif",           weight: 700, tracking: '-0.03em', transform: 'none' },
    body:     { family: "'Syne', sans-serif",           weight: 400, tracking: '-0.01em', transform: 'none' },
    label:    { family: "'Syne', sans-serif",           weight: 700, tracking: '0.08em',  transform: 'uppercase' },
    data:     { family: "'JetBrains Mono', monospace",  weight: 800, tracking: '-0.04em', transform: 'none' },
    dataSub:  { family: "'JetBrains Mono', monospace",  weight: 400, tracking: '-0.02em', transform: 'none' },
    accent: GOLD,
  },
  C: {
    id: 'C',
    name: 'Form',
    tagline: 'Sharp. Confident. Modern.',
    note: 'Space Grotesk is a geometric grotesque with personality — the "G", "R", and "a" have distinctive cuts that feel intentional at every size.',
    display:  { family: "'Space Grotesk', sans-serif",  weight: 700, tracking: '-0.05em', transform: 'none' },
    headline: { family: "'Space Grotesk', sans-serif",  weight: 700, tracking: '-0.04em', transform: 'none' },
    body:     { family: "'Space Grotesk', sans-serif",  weight: 400, tracking: '-0.01em', transform: 'none' },
    label:    { family: "'Space Grotesk', sans-serif",  weight: 700, tracking: '0.06em',  transform: 'uppercase' },
    data:     { family: "'Space Mono', monospace",      weight: 700, tracking: '-0.03em', transform: 'none' },
    dataSub:  { family: "'Space Mono', monospace",      weight: 400, tracking: '0em',     transform: 'none' },
    accent: GOLD,
  },
  D: {
    id: 'D',
    name: 'Signal',
    tagline: 'Editorial. Unexpected. Memorable.',
    note: 'Nobody uses a serif in a gym app. That\'s exactly why it works. Instrument Serif for display creates contrast against the monospace data — premium without being cold.',
    display:  { family: "'Instrument Serif', serif",    weight: 400, tracking: '-0.03em', transform: 'none', italic: true },
    headline: { family: "'Instrument Serif', serif",    weight: 400, tracking: '-0.02em', transform: 'none' },
    body:     { family: "'Instrument Sans', sans-serif",weight: 400, tracking: '-0.01em', transform: 'none' },
    label:    { family: "'Instrument Sans', sans-serif",weight: 700, tracking: '0.09em',  transform: 'uppercase' },
    data:     { family: "'JetBrains Mono', monospace",  weight: 700, tracking: '-0.04em', transform: 'none' },
    dataSub:  { family: "'JetBrains Mono', monospace",  weight: 400, tracking: '-0.01em', transform: 'none' },
    accent: GOLD,
  },
};

// ── Shared background ────────────────────────────────────────
function CardBg({ children, style, goldBorder }) {
  return (
    <div style={{
      background: 'oklch(100% 0 0 / 0.055)',
      backdropFilter: 'blur(24px) saturate(180%)',
      WebkitBackdropFilter: 'blur(24px) saturate(180%)',
      border: goldBorder ? `1px solid ${GOLD}30` : '1px solid oklch(100% 0 0 / 0.09)',
      borderRadius: 16,
      boxShadow: '0 4px 24px oklch(0% 0 0 / 0.35), inset 0 1px 0 oklch(100% 0 0 / 0.14)',
      ...style,
    }}>
      {children}
    </div>
  );
}

// ── Mini progress ring ───────────────────────────────────────
function Ring({ size=40, sw=3.5, pct=0.64, color=GOLD }) {
  const r = (size - sw) / 2;
  const circ = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform:'rotate(-90deg)', flexShrink:0 }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="oklch(100% 0 0 / 0.10)" strokeWidth={sw}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={sw}
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"/>
    </svg>
  );
}

// ════════════════════════════════════════════════════════════
// SPECIMEN CARD — one font system applied to Se7en UI content
// ════════════════════════════════════════════════════════════
function SpecimenCard({ f, selected, onClick }) {
  const isSelected = selected === f.id;

  return (
    <div
      onClick={onClick}
      className="fade-in"
      style={{
        width: 290,
        background: isSelected ? `linear-gradient(160deg, oklch(15% 0.07 52) 0%, oklch(8% 0.025 35) 100%)` : 'oklch(10% 0.018 38)',
        border: isSelected ? `1.5px solid ${GOLD}50` : '1px solid oklch(18% 0.012 38)',
        borderRadius: 22,
        overflow: 'hidden',
        cursor: 'pointer',
        boxShadow: isSelected ? `0 0 0 1px ${GOLD}20, 0 24px 48px oklch(0% 0 0 / 0.55)` : '0 8px 32px oklch(0% 0 0 / 0.40)',
        transition: 'all 0.25s cubic-bezier(0.16,1,0.3,1)',
        flexShrink: 0,
        position: 'relative',
      }}
    >
      {/* Selected badge */}
      {isSelected && (
        <div style={{ position:'absolute', top:14, right:14, zIndex:10, background:GOLD, borderRadius:99, padding:'3px 10px' }}>
          <span style={{ fontFamily:"'Barlow', sans-serif", fontSize:10, fontWeight:800, color:'oklch(8% 0.025 35)', letterSpacing:'0.08em', textTransform:'uppercase' }}>Selected</span>
        </div>
      )}

      {/* ── Option label ── */}
      <div style={{ padding:'18px 18px 0', display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
        <div style={{ width:28, height:28, borderRadius:7, background:`${GOLD}18`, border:`1px solid ${GOLD}30`, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <span style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:14, fontWeight:900, color:GOLD }}>{f.id}</span>
        </div>
        <div>
          <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:16, fontWeight:900, color:'oklch(97% 0.005 55)', letterSpacing:'0.02em', textTransform:'uppercase', lineHeight:1 }}>{f.name}</div>
          <div style={{ fontFamily:"'Barlow', sans-serif", fontSize:10, fontWeight:500, color:'oklch(44% 0.008 50)', marginTop:1 }}>{f.tagline}</div>
        </div>
      </div>

      <div style={{ padding:'0 18px 18px', display:'flex', flexDirection:'column', gap:10 }}>

        {/* ── Hero number (timer / PR weight) ── */}
        <div style={{ padding:'14px 16px 12px', background:'oklch(100% 0 0 / 0.04)', borderRadius:13, border:`1px solid ${GOLD}18` }}>
          <div style={{ fontFamily:f.label.family, fontSize:9, fontWeight:f.label.weight, color:'oklch(42% 0.006 48)', letterSpacing:f.label.tracking, textTransform:f.label.transform, marginBottom:5 }}>Duration</div>
          <div style={{ fontFamily:f.data.family, fontSize:46, fontWeight:f.data.weight, color:'oklch(97% 0.005 55)', letterSpacing:f.data.tracking, lineHeight:1, textShadow:`0 0 32px ${GOLD}30` }}>
            48<span style={{ color:'oklch(40% 0.006 48)', fontWeight:f.dataSub.weight }}>:</span>22
          </div>
          <div style={{ display:'flex', gap:14, marginTop:9 }}>
            {[{l:'Volume',v:'4,200 kg'},{l:'Sets',v:'11/11'},{l:'PRs',v:'2'}].map((s,i)=>(
              <div key={i}>
                <div style={{ fontFamily:f.data.family, fontSize:15, fontWeight:f.data.weight, color:i===0?GOLD:'oklch(88% 0.005 55)', letterSpacing:f.data.tracking, lineHeight:1 }}>{s.v}</div>
                <div style={{ fontFamily:f.label.family, fontSize:8, fontWeight:f.label.weight, color:'oklch(36% 0.006 48)', letterSpacing:f.label.tracking, textTransform:f.label.transform, marginTop:2 }}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* ── Workout title ── */}
        <div>
          <div style={{ fontFamily:f.label.family, fontSize:9, fontWeight:f.label.weight, color:GOLD, letterSpacing:f.label.tracking, textTransform:f.label.transform, marginBottom:4 }}>Day 3 · Cycle 4</div>
          <div style={{ fontFamily:f.display.family, fontSize:34, fontWeight:f.display.weight, color:'oklch(97% 0.005 55)', letterSpacing:f.display.tracking, textTransform:f.display.transform, lineHeight:1, fontStyle:f.display.italic?'italic':'normal' }}>
            Push Day
          </div>
          <div style={{ fontFamily:f.body.family, fontSize:12, fontWeight:f.body.weight, color:'oklch(52% 0.008 50)', letterSpacing:f.body.tracking, lineHeight:1.5, marginTop:4 }}>
            Push / Pull / Legs · Cycle 4 of 6 · 2 PRs broken today
          </div>
        </div>

        {/* ── Exercise row ── */}
        <div style={{ background:'oklch(100% 0 0 / 0.05)', borderRadius:11, border:'1px solid oklch(100% 0 0 / 0.08)', padding:'10px 12px', display:'flex', alignItems:'center', gap:10 }}>
          <Ring size={36} sw={3} pct={0.75} color={GOLD}/>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:f.headline.family, fontSize:14, fontWeight:f.headline.weight, color:'oklch(97% 0.005 55)', letterSpacing:f.headline.tracking, lineHeight:1, textTransform:f.headline.transform }}
            >Bench Press</div>
            <div style={{ fontFamily:f.dataSub.family, fontSize:10, color:'oklch(44% 0.008 50)', marginTop:3, letterSpacing:f.dataSub.tracking }}>3/4 sets · 100 kg × 8–12</div>
          </div>
          <div style={{ background:`${GOLD}18`, border:`1px solid ${GOLD}30`, borderRadius:4, padding:'2px 6px' }}>
            <span style={{ fontFamily:f.label.family, fontSize:9, fontWeight:f.label.weight, color:GOLD, letterSpacing:f.label.tracking, textTransform:f.label.transform }}>PR</span>
          </div>
        </div>

        {/* ── Note text ── */}
        <div style={{ fontFamily:f.body.family, fontSize:11, fontWeight:f.body.weight, color:'oklch(38% 0.008 50)', lineHeight:1.6, letterSpacing:f.body.tracking, fontStyle:'italic', borderLeft:`2px solid ${GOLD}30`, paddingLeft:10 }}>
          {f.note}
        </div>

      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// FULL DETAIL — expanded view when a font is selected
// ════════════════════════════════════════════════════════════
function DetailPanel({ f }) {
  const SCALE = [
    { name:'Hero',    fam:f.display.family,  size:'52px', weight:f.display.weight, tracking:f.display.tracking, transform:f.display.transform, italic:f.display.italic, sample:'Push Day' },
    { name:'XL',      fam:f.display.family,  size:'34px', weight:f.display.weight, tracking:f.display.tracking, transform:f.display.transform, italic:f.display.italic, sample:'Day 3 · Cycle 4' },
    { name:'Header',  fam:f.headline.family, size:'22px', weight:f.headline.weight,tracking:f.headline.tracking,transform:f.headline.transform, sample:'Bench Press' },
    { name:'Body',    fam:f.body.family,     size:'14px', weight:f.body.weight,    tracking:f.body.tracking,    sample:'Log your sets below. Tap to expand each exercise.' },
    { name:'Label',   fam:f.label.family,    size:'10px', weight:f.label.weight,   tracking:f.label.tracking,   transform:f.label.transform,    sample:'Weight Unit · Rest Timer' },
    { name:'Data XL', fam:f.data.family,     size:'42px', weight:f.data.weight,    tracking:f.data.tracking,    sample:'48:22',        gold:true },
    { name:'Data LG', fam:f.data.family,     size:'24px', weight:f.data.weight,    tracking:f.data.tracking,    sample:'100 kg × 12', gold:true },
    { name:'Data SM', fam:f.dataSub.family,  size:'12px', weight:f.dataSub.weight, tracking:f.dataSub.tracking, sample:'4 × 8–12 rep range · Set 3' },
  ];

  return (
    <div className="fade-in" style={{ width:320, display:'flex', flexDirection:'column', gap:0 }}>
      {/* Heading */}
      <div style={{ marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
          <div style={{ width:30, height:30, borderRadius:8, background:`${GOLD}18`, border:`1px solid ${GOLD}30`, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ fontFamily:"'Barlow Condensed'", fontSize:15, fontWeight:900, color:GOLD }}>{f.id}</span>
          </div>
          <div style={{ fontFamily:f.display.family, fontSize:28, fontWeight:f.display.weight, color:'oklch(97% 0.005 55)', letterSpacing:f.display.tracking, textTransform:f.display.transform, fontStyle:f.display.italic?'italic':'normal', lineHeight:1 }}>{f.name}</div>
        </div>
        <p style={{ fontFamily:f.body.family, fontSize:12, color:'oklch(50% 0.008 50)', lineHeight:1.65, letterSpacing:f.body.tracking }}>{f.note}</p>
      </div>

      {/* Font names */}
      <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:16 }}>
        {[
          { role:'Display', fam:f.display.family.split(',')[0].replace(/'/g,'') },
          { role:'Body',    fam:f.body.family.split(',')[0].replace(/'/g,'')    },
          { role:'Data',    fam:f.data.family.split(',')[0].replace(/'/g,'')    },
        ].map((t,i) => (
          <div key={i} style={{ padding:'3px 10px 3px 8px', background:'oklch(100% 0 0 / 0.06)', border:'1px solid oklch(100% 0 0 / 0.10)', borderRadius:99, display:'flex', gap:6, alignItems:'center' }}>
            <span style={{ fontFamily:"'Barlow', sans-serif", fontSize:9, fontWeight:700, color:'oklch(36% 0.006 48)', letterSpacing:'0.07em', textTransform:'uppercase' }}>{t.role}</span>
            <span style={{ fontFamily:f.data.family, fontSize:10, color:'oklch(60% 0.006 50)' }}>{t.fam}</span>
          </div>
        ))}
      </div>

      {/* Type scale */}
      <div style={{ background:'oklch(100% 0 0 / 0.04)', border:'1px solid oklch(100% 0 0 / 0.07)', borderRadius:14, overflow:'hidden' }}>
        {SCALE.map((s,i) => (
          <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 14px', borderBottom:i<SCALE.length-1?'1px solid oklch(100% 0 0 / 0.06)':'none' }}>
            <div style={{ width:52, flexShrink:0 }}>
              <div style={{ fontFamily:"'Barlow', monospace", fontSize:9, fontWeight:700, color:GOLD, letterSpacing:'0.05em' }}>{s.name}</div>
              <div style={{ fontFamily:"'Barlow', monospace", fontSize:9, color:'oklch(30% 0.006 48)', marginTop:1 }}>{s.size}</div>
            </div>
            <div style={{
              flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
              fontFamily:s.fam, fontSize:s.size, fontWeight:s.weight,
              color:s.gold ? GOLD : 'oklch(92% 0.005 55)',
              letterSpacing:s.tracking, textTransform:s.transform||'none',
              fontStyle:s.italic?'italic':'normal',
              lineHeight:1.2,
              textShadow:s.gold?`0 0 16px ${GOLD}44`:'none',
            }}>{s.sample}</div>
          </div>
        ))}
      </div>

      {/* Post-workout mini mock */}
      <div style={{ marginTop:14, background:'linear-gradient(140deg, oklch(14% 0.07 52) 0%, oklch(7% 0.025 35) 100%)', border:`1px solid ${GOLD}22`, borderRadius:14, padding:'14px 16px' }}>
        <div style={{ fontFamily:f.label.family, fontSize:9, fontWeight:f.label.weight, color:GOLD, letterSpacing:f.label.tracking, textTransform:f.label.transform||'none', marginBottom:6 }}>Workout Complete · Day 3</div>
        <div style={{ fontFamily:f.display.family, fontSize:28, fontWeight:f.display.weight, color:'oklch(97% 0.005 55)', letterSpacing:f.display.tracking, textTransform:f.display.transform||'none', fontStyle:f.display.italic?'italic':'normal', lineHeight:1, marginBottom:4 }}>Push Day</div>
        <div style={{ fontFamily:f.data.family, fontSize:38, fontWeight:f.data.weight, color:'oklch(97% 0.005 55)', letterSpacing:f.data.tracking, lineHeight:1, marginBottom:10, textShadow:`0 0 28px ${GOLD}30` }}>
          48<span style={{ color:'oklch(38% 0.006 48)' }}>:</span>22
        </div>
        <div style={{ display:'flex', gap:1, background:`${GOLD}18`, borderRadius:8, overflow:'hidden' }}>
          {[{l:'Volume',v:'4,200 kg'},{l:'Sets',v:'11/11'},{l:'PRs',v:'2'}].map((s,i)=>(
            <div key={i} style={{ flex:1, padding:'8px 10px', background:`${GOLD}09`, textAlign:'center' }}>
              <div style={{ fontFamily:f.data.family, fontSize:15, fontWeight:f.data.weight, color:'oklch(94% 0.005 55)', letterSpacing:f.data.tracking }}>{s.v}</div>
              <div style={{ fontFamily:f.label.family, fontSize:8, fontWeight:f.label.weight, color:GOLD, letterSpacing:f.label.tracking, textTransform:f.label.transform||'none', marginTop:2 }}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [selected, setSelected] = useState('B');
  const fonts = Object.values(FONTS);

  return (
    <div style={{ width:'100%', height:'100vh', background:'oklch(7% 0.020 36)', display:'flex', flexDirection:'column', overflow:'hidden', position:'relative' }}>
      {/* Ambient */}
      <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:0 }}>
        <div style={{ position:'absolute', top:'-10%', right:'20%', width:500, height:500, borderRadius:'50%', background:'radial-gradient(circle, oklch(72% 0.22 52 / 0.07) 0%, transparent 70%)' }}/>
        <div style={{ position:'absolute', bottom:'-5%', left:'5%', width:400, height:400, borderRadius:'50%', background:'radial-gradient(circle, oklch(60% 0.22 28 / 0.05) 0%, transparent 70%)' }}/>
      </div>

      {/* Header */}
      <div style={{ position:'relative', zIndex:2, flexShrink:0, height:52, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px', borderBottom:'1px solid oklch(100% 0 0 / 0.07)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <span style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:18, fontWeight:900, color:'oklch(97% 0.005 55)', letterSpacing:'0.02em', textTransform:'uppercase' }}>Se<span style={{ color:GOLD }}>7</span>en</span>
          <span style={{ color:'oklch(22% 0.010 38)', fontSize:14 }}>·</span>
          <span style={{ fontFamily:"'Barlow', sans-serif", fontSize:12, color:'oklch(42% 0.008 50)' }}>Type Specimen</span>
        </div>
        <div style={{ display:'flex', gap:6 }}>
          {fonts.map(f => (
            <button key={f.id} onClick={() => setSelected(f.id)} style={{
              padding:'4px 12px', borderRadius:99,
              background: selected===f.id ? GOLD : 'oklch(100% 0 0 / 0.05)',
              border: selected===f.id ? `1px solid ${GOLD}80` : '1px solid oklch(100% 0 0 / 0.08)',
              fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:800,
              color: selected===f.id ? 'oklch(8% 0.025 35)' : 'oklch(48% 0.008 50)',
              letterSpacing:'0.06em', textTransform:'uppercase',
              transition:'all 0.2s ease',
            }}>{f.id} — {f.name}</button>
          ))}
        </div>
      </div>

      {/* Body — 2-col layout: 2×2 card grid left, detail right */}
      <div style={{ position:'relative', zIndex:1, flex:1, display:'flex', overflow:'hidden' }}>

        {/* Cards — 2×2 grid */}
        <div style={{ flex:'0 0 640px', overflowY:'auto', padding:'20px 18px', borderRight:'1px solid oklch(100% 0 0 / 0.07)' }}>
          <div style={{ fontFamily:"'Barlow', sans-serif", fontSize:10, fontWeight:700, color:'oklch(30% 0.006 48)', letterSpacing:'0.10em', textTransform:'uppercase', marginBottom:12, paddingLeft:2 }}>
            4 Directions — click to select
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            {fonts.map(f => (
              <SpecimenCard key={f.id} f={f} selected={selected} onClick={() => setSelected(f.id)} />
            ))}
          </div>
        </div>

        {/* Detail */}
        <div style={{ flex:1, overflowY:'auto', padding:'20px 26px' }}>
          {selected && <DetailPanel f={FONTS[selected]} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
