<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A08"/>
      <stop offset="100%" stop-color="#04050B"/>
    </linearGradient>
    <linearGradient id="p-7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D8"/>
      <stop offset="100%" stop-color="#FFA830"/>
    </linearGradient>
    <linearGradient id="p-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6040" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF4040" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FF6040" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6040" stop-opacity="0"/>
    </linearGradient>
    <filter id="p-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="p-7glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="46" fill="url(#p-bg)"/>

  <!-- Faint baseline grid lines -->
  <line x1="0" y1="110" x2="200" y2="110" stroke="rgba(255,140,0,0.06)" stroke-width="1"/>
  <line x1="0" y1="60"  x2="200" y2="60"  stroke="rgba(255,140,0,0.04)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(255,140,0,0.04)" stroke-width="1"/>

  <!-- Bold 7 (behind pulse) -->
  <text x="100" y="155"
    font-family="'Arial Black','Helvetica Neue',sans-serif"
    font-size="148" font-weight="900"
    fill="url(#p-7)"
    text-anchor="middle"
    letter-spacing="-6"
    filter="url(#p-7glow)">7</text>

  <!-- Pulse / heartbeat line cutting horizontally -->
  <path d="M 0 110 L 48 110 L 56 96 L 64 132 L 72 78 L 80 142 L 88 102 L 96 122 L 130 122 L 138 96 L 200 96"
    stroke="url(#p-pulse)" stroke-width="3.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#p-glow)"/>

  <!-- Bright pulse dot -->
  <circle cx="80" cy="142" r="3" fill="#FF4040" filter="url(#p-glow)"/>
</svg>
