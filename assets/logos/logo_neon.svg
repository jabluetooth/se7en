<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="n-bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feMerge><feMergeNode in="b1"/></feMerge>
    </filter>
    <filter id="n-medGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="n-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A0A18"/>
      <stop offset="100%" stop-color="#04030A"/>
    </radialGradient>
  </defs>

  <!-- Dark vignette background -->
  <rect width="200" height="200" rx="46" fill="url(#n-bg)"/>

  <!-- Faint grid (cyberpunk texture) -->
  <g stroke="rgba(255,140,80,0.05)" stroke-width="0.5">
    <line x1="0" y1="40"  x2="200" y2="40"/>
    <line x1="0" y1="80"  x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="40"  y1="0" x2="40"  y2="200"/>
    <line x1="80"  y1="0" x2="80"  y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
  </g>

  <!-- Outer big glow halo -->
  <path d="M 45 58 L 155 58 L 95 168"
    stroke="#FF4400" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.45" filter="url(#n-bigGlow)"/>

  <!-- Mid neon glow -->
  <path d="M 45 58 L 155 58 L 95 168"
    stroke="#FF8C00" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
    fill="none" filter="url(#n-medGlow)"/>

  <!-- Inner crisp tube -->
  <path d="M 45 58 L 155 58 L 95 168"
    stroke="#FFB050" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
    fill="none"/>

  <!-- White-hot core -->
  <path d="M 45 58 L 155 58 L 95 168"
    stroke="#FFF8E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    fill="none"/>

  <!-- Tube endpoint caps -->
  <circle cx="45"  cy="58"  r="4" fill="#FFF8E0" filter="url(#n-medGlow)"/>
  <circle cx="155" cy="58"  r="4" fill="#FFF8E0" filter="url(#n-medGlow)"/>
  <circle cx="95"  cy="168" r="4" fill="#FFF8E0" filter="url(#n-medGlow)"/>
</svg>
