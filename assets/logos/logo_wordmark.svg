<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="seven" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FF8C00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="120" rx="20" fill="#08090F"/>

  <!-- SE · accent bar · EN layout -->

  <!-- "SE" -->
  <text x="30" y="80"
    font-family="'Arial Black','Helvetica Neue',sans-serif"
    font-size="62" font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2">SE</text>

  <!-- "7" in orange, slightly larger -->
  <text x="166" y="84"
    font-family="'Arial Black','Helvetica Neue',sans-serif"
    font-size="70" font-weight="900"
    fill="url(#seven)"
    letter-spacing="-2"
    filter="url(#softglow)">7</text>

  <!-- "EN" -->
  <text x="218" y="80"
    font-family="'Arial Black','Helvetica Neue',sans-serif"
    font-size="62" font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2">EN</text>

  <!-- Accent underline bar -->
  <rect x="30" y="92" width="360" height="2.5" rx="2" fill="url(#bar)"/>

  <!-- Tagline -->
  <text x="210" y="112"
    font-family="'Helvetica Neue','Arial',sans-serif"
    font-size="11" font-weight="500"
    fill="rgba(255,240,220,0.35)"
    text-anchor="middle"
    letter-spacing="3.5">7-DAY CYCLE TRAINER</text>
</svg>
