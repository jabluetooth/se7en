<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1A1008"/>
      <stop offset="100%" stop-color="#06070E"/>
    </radialGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="200" height="200" rx="48" fill="url(#bg)"/>

  <!-- Outer orbit ring (full, faint) -->
  <circle cx="100" cy="98" r="74" fill="none"
    stroke="rgba(255,140,0,0.08)" stroke-width="1.5"/>

  <!-- Bright arc — top-right quarter -->
  <path d="M 100 24 A 74 74 0 0 1 174 98"
    fill="none" stroke="url(#arc1)" stroke-width="3" stroke-linecap="round"/>

  <!-- Mid orbit ring -->
  <circle cx="100" cy="98" r="52" fill="none"
    stroke="rgba(255,140,0,0.06)" stroke-width="1"/>

  <!-- Faint arc — bottom-left -->
  <path d="M 100 172 A 74 74 0 0 1 26 98"
    fill="none" stroke="rgba(255,140,0,0.20)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dot on arc -->
  <circle cx="174" cy="98" r="4" fill="#FF8C00" filter="url(#glow)"/>
  <circle cx="100" cy="24" r="3" fill="rgba(255,140,0,0.45)"/>

  <!-- Bold 7 -->
  <text x="102" y="130"
    font-family="'Arial Black','Helvetica Neue',sans-serif"
    font-size="82" font-weight="900"
    fill="url(#orange)"
    text-anchor="middle"
    letter-spacing="-3"
    filter="url(#glow)">7</text>
</svg>
