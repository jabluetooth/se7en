<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ringBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A1208"/>
      <stop offset="100%" stop-color="#07080E"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9035F0"/>
      <stop offset="40%"  stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#2ECAC4"/>
    </linearGradient>
    <linearGradient id="num7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD060"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="ringglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="numglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip to show only 270° of ring (gap at bottom-right) -->
    <clipPath id="ringClip">
      <path d="M 100 100 L 200 0 A 200 200 0 1 0 200 200 Z"/>
    </clipPath>
  </defs>

  <!-- Square background -->
  <rect width="200" height="200" rx="48" fill="url(#ringBg)"/>

  <!-- Gradient ring — outer glow -->
  <circle cx="100" cy="100" r="76"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="14"
    stroke-dasharray="410 60"
    stroke-dashoffset="0"
    stroke-linecap="round"
    filter="url(#ringglow)"
    opacity="0.6"/>

  <!-- Gradient ring — crisp overlay -->
  <circle cx="100" cy="100" r="76"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="5"
    stroke-dasharray="420 60"
    stroke-dashoffset="0"
    stroke-linecap="round"/>

  <!-- Inner dark fill so 7 reads cleanly -->
  <circle cx="100" cy="100" r="68" fill="#07080E"/>

  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="60"
    fill="none"
    stroke="rgba(255,200,80,0.08)"
    stroke-width="1"/>

  <!-- Bold 7 -->
  <text x="102" y="130"
    font-family="'Arial Black','Helvetica Neue',sans-serif"
    font-size="80" font-weight="900"
    fill="url(#num7)"
    text-anchor="middle"
    letter-spacing="-3"
    filter="url(#numglow)">7</text>
</svg>
