<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <pattern id="b-noise" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent"/>
      <circle cx="0.5" cy="0.5" r="0.3" fill="rgba(0,0,0,0.05)"/>
      <circle cx="2" cy="2" r="0.3" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <!-- Sharp-cornered orange field (slightly rounded for app-icon use) -->
  <rect width="200" height="200" rx="18" fill="url(#b-bg)"/>
  <rect width="200" height="200" rx="18" fill="url(#b-noise)"/>

  <!-- Industrial corner brackets -->
  <g stroke="rgba(0,0,0,0.55)" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M 14 26 L 14 14 L 26 14"/>
    <path d="M 174 14 L 186 14 L 186 26"/>
    <path d="M 186 174 L 186 186 L 174 186"/>
    <path d="M 26 186 L 14 186 L 14 174"/>
  </g>

  <!-- Geometric 7 (negative space, sharp angular) -->
  <path d="M 32 38 L 168 38 L 168 64 L 110 64 L 88 162 L 62 162 L 84 64 L 32 64 Z" fill="#0A0B12"/>

  <!-- Stamp registration marks -->
  <circle cx="36" cy="178" r="3" fill="rgba(0,0,0,0.55)"/>
  <circle cx="164" cy="178" r="3" fill="rgba(0,0,0,0.55)"/>

  <!-- Bottom industrial label -->
  <text x="100" y="183"
    font-family="'Helvetica Neue','Arial',sans-serif"
    font-size="7" font-weight="800"
    fill="rgba(0,0,0,0.65)"
    text-anchor="middle"
    letter-spacing="5">SE · 07 · EN</text>
</svg>
