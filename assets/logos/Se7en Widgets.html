<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Se7en — Widget System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: oklch(7% 0.020 36); scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: oklch(7% 0.020 36); color: oklch(97% 0.005 55); min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: oklch(20% 0.012 38); border-radius: 3px; }
    button { font-family: 'DM Sans', sans-serif; }

    /* shared section label */
    .sec-label { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .sec-num   { font: 600 10px/1 'DM Mono', monospace; color: oklch(78% 0.20 68); letter-spacing: 0.08em; }
    .sec-title { font: 700 10px/1 'DM Sans', sans-serif; color: oklch(42% 0.006 48); letter-spacing: 0.10em; text-transform: uppercase; }
    .sec-line  { flex: 1; height: 1px; background: oklch(100% 0 0 / 0.07); }

    /* phone bezel */
    .phone {
      width: 390px; height: 844px;
      border-radius: 52px;
      background: oklch(8% 0.015 36);
      border: 10px solid oklch(14% 0.012 38);
      box-shadow: 0 0 0 1px oklch(28% 0.010 38), 0 40px 80px oklch(0% 0 0 / 0.70), inset 0 1px 0 oklch(100% 0 0 / 0.08);
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .phone-notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 130px; height: 38px;
      background: oklch(6% 0.010 36); border-radius: 0 0 22px 22px; z-index: 20;
    }
    .phone-capsule {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 18px;
      background: #000; border-radius: 99px; z-index: 21;
      display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; gap: 5px;
    }

    /* widget chrome */
    .widget-chrome {
      border-radius: 26px; overflow: hidden; position: relative;
      box-shadow: 0 8px 32px oklch(0% 0 0 / 0.55), inset 0 1px 0 oklch(100% 0 0 / 0.12);
    }
    .widget-label { font: 600 10px/1 'DM Mono', monospace; color: oklch(36% 0.006 48); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; margin-top: 8px; }

    /* di state pill */
    .di-state-btn {
      padding: 5px 12px; border-radius: 99px; border: none; cursor: pointer;
      font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>
<!-- Global SVG defs (gradients shared across SVGs) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g-mark" x1="14" y1="20" x2="36" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="oklch(94% 0.12 80)"/>
      <stop offset="40%"  stop-color="oklch(81% 0.20 68)"/>
      <stop offset="100%" stop-color="oklch(62% 0.27 44)"/>
    </linearGradient>
    <linearGradient id="g-icon-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="oklch(17% 0.08 52)"/>
      <stop offset="100%" stop-color="oklch(5.5% 0.015 32)"/>
    </linearGradient>
    <linearGradient id="g-bar" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%"   stop-color="oklch(70% 0.24 42)"/>
      <stop offset="100%" stop-color="oklch(78% 0.20 68)"/>
    </linearGradient>
  </defs>
</svg>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Colors
const GOLD  = 'oklch(78% 0.20 68)';
const FIRE  = 'oklch(70% 0.24 42)';
const COOL  = 'oklch(64% 0.14 220)';
const WARN  = 'oklch(76% 0.16 68)';

// ── App icon SVG
function AppIcon({ size = 36 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" style={{flexShrink:0}}>
      <rect width="100" height="100" rx="22" fill="url(#g-icon-bg)"/>
      <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.5" fill="none" stroke="oklch(100% 0 0 / 0.08)" strokeWidth="1.5"/>
      <line x1="15" y1="28" x2="85" y2="28" stroke="url(#g-mark)" strokeWidth="17" strokeLinecap="round"/>
      <line x1="85" y1="28" x2="36" y2="80" stroke="url(#g-mark)" strokeWidth="12.5" strokeLinecap="round"/>
      <line x1="49" y1="52" x2="72" y2="52" stroke="url(#g-mark)" strokeWidth="9" strokeLinecap="round"/>
    </svg>
  );
}

// ── Circular progress ring
function Ring({ size, sw, value, max, color, trackColor, children }) {
  const r = (size - sw) / 2;
  const circ = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value / max));
  return (
    <div style={{ position:'relative', width:size, height:size, flexShrink:0 }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)', display:'block' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={trackColor || 'oklch(100% 0 0 / 0.10)'} strokeWidth={sw}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={sw}
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)}
          strokeLinecap="round" style={{ transition:'stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1)' }}/>
      </svg>
      {children && (
        <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
          {children}
        </div>
      )}
    </div>
  );
}

// ── Live timer hooks
function useCountdown(start) {
  const [secs, setSecs] = useState(start);
  useEffect(() => {
    if (secs <= 0) { const t = setTimeout(() => setSecs(start), 800); return () => clearTimeout(t); }
    const id = setInterval(() => setSecs(s => s - 1), 1000);
    return () => clearInterval(id);
  }, [secs]);
  return {
    secs, total: start,
    display: `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`,
    pct: secs / start,
  };
}
function useSessionTimer(init) {
  const [secs, setSecs] = useState(init);
  useEffect(() => { const id = setInterval(() => setSecs(s => s+1), 1000); return () => clearInterval(id); }, []);
  return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}

// ── Shared status bar
function PhoneStatusBar({ time='9:41' }) {
  return (
    <div style={{ position:'absolute', top:0, left:0, right:0, zIndex:15, height:50, display:'flex', alignItems:'flex-end', justifyContent:'space-between', padding:'0 24px 8px' }}>
      <span style={{ fontFamily:'-apple-system, system-ui', fontSize:15, fontWeight:590, color:'#fff' }}>{time}</span>
      <div style={{ display:'flex', gap:6, alignItems:'center' }}>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <rect x="0" y="4" width="3" height="8" rx="0.7" fill="white"/>
          <rect x="5" y="2.5" width="3" height="9.5" rx="0.7" fill="white"/>
          <rect x="10" y="0" width="3" height="12" rx="0.7" fill="white"/>
          <rect x="15" y="0" width="2" height="12" rx="0.7" fill="white" opacity="0.3"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="white"/>
          <path d="M23 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="white" fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 01 — DYNAMIC ISLAND
// ═══════════════════════════════════════════════════════════════
function DynamicIslandSection({ rest, session }) {
  const [state, setState] = useState('expanded-workout');

  const STATES = [
    { id:'compact',          label:'Compact'     },
    { id:'expanded-workout', label:'Active Ex.'  },
    { id:'expanded-timer',   label:'Rest Timer'  },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16 }}>
      {/* State picker */}
      <div style={{ display:'flex', gap:6, background:'oklch(100% 0 0 / 0.05)', borderRadius:99, padding:4, border:'1px solid oklch(100% 0 0 / 0.08)' }}>
        {STATES.map(s => (
          <button key={s.id} onClick={() => setState(s.id)} className="di-state-btn" style={{
            background: state === s.id ? GOLD : 'transparent',
            color: state === s.id ? 'oklch(12% 0.025 40)' : 'oklch(52% 0.008 50)',
          }}>{s.label}</button>
        ))}
      </div>

      {/* Context bar mimicking top of phone */}
      <div style={{ width:390, background:'oklch(8% 0.022 38)', borderRadius:'24px 24px 0 0', border:'1px solid oklch(20% 0.012 38)', borderBottom:'none', padding:'14px 0 0', display:'flex', flexDirection:'column', alignItems:'center', gap:12 }}>
        {/* Capsule */}
        <div style={{ width:126, height:37, background:'#000', borderRadius:99, boxShadow:'0 2px 12px oklch(0% 0 0 / 0.60)' }} />

        {/* Islands */}
        <div style={{ width:'100%', display:'flex', justifyContent:'center', padding:'0 16px 20px', minHeight:80, alignItems:'center' }}>

          {state === 'compact' && (
            <div style={{ display:'flex', alignItems:'center', gap:7, background:'#050403', borderRadius:99, padding:'0 14px 0 7px', height:36, boxShadow:'0 6px 28px oklch(0% 0 0 / 0.70)', border:'1px solid oklch(100% 0 0 / 0.06)' }}>
              <Ring size={26} sw={2.5} value={rest.secs} max={rest.total} color={COOL} trackColor="oklch(100% 0 0 / 0.12)">
                <span style={{ fontFamily:"'DM Mono'", fontSize:7, fontWeight:800, color:COOL }}>⏱</span>
              </Ring>
              <span style={{ fontFamily:"'DM Sans'", fontSize:13, fontWeight:700, color:'#fff' }}>Bench Press</span>
              <div style={{ width:1, height:14, background:'oklch(100% 0 0 / 0.12)' }} />
              <span style={{ fontFamily:"'DM Mono'", fontSize:13, fontWeight:700, color:COOL }}>{rest.display}</span>
              <div style={{ width:1, height:14, background:'oklch(100% 0 0 / 0.12)' }} />
              <span style={{ fontFamily:"'DM Mono'", fontSize:13, fontWeight:600, color:GOLD }}>3/4</span>
            </div>
          )}

          {state === 'expanded-workout' && (
            <div style={{ background:'#050403', borderRadius:26, padding:'16px 18px 14px', width:350, boxShadow:'0 16px 56px oklch(0% 0 0 / 0.75)', border:'1px solid oklch(100% 0 0 / 0.07)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
                <AppIcon size={20}/>
                <span style={{ fontFamily:"'DM Sans'", fontSize:11, fontWeight:700, color:'oklch(40% 0.006 48)', letterSpacing:'0.06em', textTransform:'uppercase' }}>Se7en · Push Day · Day 3</span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                <div>
                  <div style={{ fontFamily:"'DM Sans'", fontSize:20, fontWeight:800, color:'#fff', letterSpacing:'-0.03em', marginBottom:4 }}>Bench Press</div>
                  <div style={{ fontFamily:"'DM Mono'", fontSize:12, color:'oklch(40% 0.006 48)' }}>Set 3 of 4 · 100 kg × 8–12</div>
                </div>
                <Ring size={52} sw={4.5} value={3} max={4} color={GOLD} trackColor="oklch(100% 0 0 / 0.08)">
                  <div style={{ textAlign:'center' }}>
                    <div style={{ fontFamily:"'DM Mono'", fontSize:13, fontWeight:800, color:'#fff', lineHeight:1 }}>3/4</div>
                  </div>
                </Ring>
              </div>
              <div style={{ marginTop:12, paddingTop:10, borderTop:'1px solid oklch(100% 0 0 / 0.07)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ display:'flex', gap:4, alignItems:'center' }}>
                  <div style={{ width:5, height:5, borderRadius:'50%', background:GOLD, boxShadow:`0 0 6px ${GOLD}` }} />
                  <span style={{ fontFamily:"'DM Mono'", fontSize:11, color:GOLD }}>Cycle 4 · {session}</span>
                </div>
                <div style={{ display:'flex', gap:12 }}>
                  {[{v:'4,200 kg', l:'Volume'},{v:'7/11', l:'Sets'}].map((s,i) => (
                    <div key={i} style={{ textAlign:'right' }}>
                      <div style={{ fontFamily:"'DM Mono'", fontSize:13, fontWeight:700, color:'#fff' }}>{s.v}</div>
                      <div style={{ fontFamily:"'DM Sans'", fontSize:9, color:'oklch(38% 0.006 48)', textTransform:'uppercase', letterSpacing:'0.05em' }}>{s.l}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {state === 'expanded-timer' && (
            <div style={{ background:'#050403', borderRadius:26, padding:'15px 18px', width:320, boxShadow:'0 16px 56px oklch(0% 0 0 / 0.75)', border:'1px solid oklch(100% 0 0 / 0.07)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
                <AppIcon size={20}/>
                <span style={{ fontFamily:"'DM Sans'", fontSize:11, fontWeight:700, color:'oklch(40% 0.006 48)', letterSpacing:'0.06em', textTransform:'uppercase' }}>Rest Timer</span>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:18 }}>
                <Ring size={80} sw={6} value={rest.secs} max={rest.total} color={COOL} trackColor="oklch(100% 0 0 / 0.10)">
                  <div style={{ textAlign:'center' }}>
                    <div style={{ fontFamily:"'DM Mono'", fontSize:18, fontWeight:800, color:'#fff', letterSpacing:'-0.04em', lineHeight:1 }}>{rest.display}</div>
                    <div style={{ fontFamily:"'DM Sans'", fontSize:8, color:'oklch(38% 0.006 48)', textTransform:'uppercase', letterSpacing:'0.04em', marginTop:2 }}>rest</div>
                  </div>
                </Ring>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:"'DM Sans'", fontSize:12, fontWeight:600, color:'oklch(38% 0.006 48)', marginBottom:4 }}>Up next</div>
                  <div style={{ fontFamily:"'DM Sans'", fontSize:16, fontWeight:700, color:'#fff', marginBottom:3 }}>Bench Press</div>
                  <div style={{ fontFamily:"'DM Mono'", fontSize:12, color:GOLD }}>Set 4 · 100 kg</div>
                  <div style={{ marginTop:8, height:3, borderRadius:99, background:'oklch(100% 0 0 / 0.10)', overflow:'hidden' }}>
                    <div style={{ width:`${rest.pct*100}%`, height:'100%', background:`linear-gradient(90deg, ${COOL}, oklch(72% 0.12 200))`, borderRadius:99, transition:'width 1s linear' }} />
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// 03 — HOME SCREEN PHONE
// ═══════════════════════════════════════════════════════════════
function HomeScreenPhone({ rest, session }) {
  return (
    <div className="phone">
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(160deg, oklch(9% 0.028 38) 0%, oklch(6% 0.018 42) 40%, oklch(9% 0.030 30) 75%, oklch(7% 0.022 38) 100%)' }}>
        <div style={{ position:'absolute', top:60, right:20, width:200, height:200, borderRadius:'50%', background:'radial-gradient(circle, oklch(72% 0.22 52 / 0.14) 0%, transparent 70%)' }} />
      </div>
      <div style={{ position:'relative', zIndex:1, height:'100%', display:'flex', flexDirection:'column' }}>
        <PhoneStatusBar time="9:41" />
