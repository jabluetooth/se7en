<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320">

  <!-- Background -->
  <rect width="280" height="320" fill="#181B22"/>

  <!-- Circle interior (slightly darker than bg for depth) -->
  <circle cx="140" cy="132" r="108" fill="#0E1018"/>

  <!-- Ring -->
  <circle cx="140" cy="132" r="108"
          fill="none" stroke="#1EB8FF" stroke-width="5.5"/>

  <!--
    "7" — clean, no kink.
    Top bar: (84,90) → (196,90)
    Diagonal: → (122,192)
  -->
  <path d="M 84,90 L 196,90 L 122,192"
        fill="none"
        stroke="#1EB8FF"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!--
    Lightning slash — 45° diagonal, upper-right to lower-left.
    Verified to cross the 7's top bar at x≈193,y=90
    and the 7's diagonal at (157,139).
    Both endpoints sit well inside the ring.
  -->
  <line x1="205" y1="78" x2="88" y2="196"
        stroke="#1EB8FF"
        stroke-width="5.5"
        stroke-linecap="round"/>

  <!-- SE7EN wordmark -->
  <text x="140" y="275"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="900"
        text-anchor="middle" letter-spacing="5">
    <tspan fill="#ffffff">SE</tspan><tspan fill="#1EB8FF">7</tspan><tspan fill="#ffffff">EN</tspan>
  </text>

</svg>
