<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130">
  <defs>
    <linearGradient id="m-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB040"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
  </defs>

  <rect width="460" height="130" rx="16" fill="#08090F"/>

  <!-- Thin "se" -->
  <text x="80" y="80"
    font-family="'Helvetica Neue','Inter','Arial',sans-serif"
    font-size="76" font-weight="200"
    fill="#FFFFFF"
