  <!-- Decorative orange dot at end -->
  <circle cx="396" cy="78" r="5" fill="#FF8C00"/>

  <!-- Tagline -->
  <text x="80" y="108"
    font-family="'Helvetica Neue','Inter','Arial',sans-serif"
